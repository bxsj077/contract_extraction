[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-extraction-cn"
version = "0.1.0"
description = "Local-first Chinese PDF contract OCR and evidence-backed extraction pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
  "pypdf>=5,<7",
  "PyMuPDF>=1.24,<2",
  "rapidocr-onnxruntime>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
contract-extract = "contract_extraction.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

