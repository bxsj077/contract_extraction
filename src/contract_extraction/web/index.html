<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>前后向合同履约风险审查</title><style>
:root{--navy:#153654;--blue:#246b9e;--bg:#f4f7fa;--red:#b42318;--amber:#b54708;--green:#067647}*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:#172b3a}header{background:linear-gradient(120deg,var(--navy),var(--blue));color:white;padding:22px 5vw}header h1{margin:0 0 6px;font-size:24px}header p{margin:0;opacity:.85}
main{padding:24px 5vw}.toolbar{display:flex;gap:12px;margin-bottom:18px}button,a.btn{border:0;border-radius:6px;padding:10px 16px;background:var(--blue);color:white;text-decoration:none;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}.card{background:white;border-radius:9px;padding:16px;box-shadow:0 1px 5px #15365418}.card b{font-size:25px;display:block;margin-top:8px}.panel{background:white;border-radius:9px;padding:18px;box-shadow:0 1px 5px #15365418;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e5eaef;text-align:left;white-space:nowrap}th{color:#536575;font-size:13px}.risk-高风险{color:var(--red);font-weight:700}.risk-中风险{color:var(--amber);font-weight:700}.risk-无风险{color:var(--green);font-weight:700}.empty{text-align:center;padding:40px;color:#708090}
</style></head><body><header><h1>前后向合同智能解析与履约风险审查系统</h1><p>证据可追溯 · 结构化提取 · 确定性风险规则</p></header><main>
<div class="toolbar"><button onclick="scan()">扫描并处理项目</button><a class="btn" href="/api/export.xlsx">导出审查结果</a></div><section id="cards" class="cards"></section>
<section class="panel"><h2>项目列表</h2><table><thead><tr><th>项目编码</th><th>状态</th><th>风险等级</th><th>设备差异</th><th>工期风险</th><th>实施差异</th><th>待复核</th><th>更新时间</th></tr></thead><tbody id="rows"></tbody></table></section></main>
<script>async function get(u,o){let r=await fetch(u,o);if(!r.ok)throw Error(await r.text());return r.json()}async function load(){let d=await get('/api/dashboard');cards.innerHTML=Object.entries(d).map(([k,v])=>`<div class=card><span>${k}</span><b>${v}</b></div>`).join('');let ps=await get('/api/projects');rows.innerHTML=ps.length?ps.map(x=>{let p=x.payload;return `<tr onclick="location='/api/projects/${x.project_code}'"><td>${x.project_code}</td><td>${x.status}</td><td class="risk-${x.risk_level}">${x.risk_level}</td><td>${p.equipment_differences?.length||0}</td><td>${p.schedule_differences?.length||0}</td><td>${p.scope_differences?.length||0}</td><td>${p.review_issues?.length||0}</td><td>${x.updated_at}</td></tr>`}).join(''):'<tr><td colspan=8 class=empty>尚无处理结果</td></tr>'}async function scan(){if(!confirm('开始扫描并处理合同目录？OCR可能需要较长时间。'))return;await get('/api/scan',{method:'POST'});load()}load().catch(e=>alert(e.message));</script></body></html>
