<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>前后向合同履约风险审查</title><style>
:root{--navy:#153654;--blue:#246b9e;--bg:#f4f7fa;--red:#b42318;--amber:#b54708;--green:#067647}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:#172b3a}header{background:linear-gradient(120deg,var(--navy),var(--blue));color:white;padding:22px 4vw}header h1{margin:0 0 6px;font-size:24px}header p{margin:0;opacity:.85}main{padding:24px 4vw}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}button,a.btn{border:0;border-radius:6px;padding:10px 16px;background:var(--blue);color:white;text-decoration:none;cursor:pointer}.secondary{background:#526b7e}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}.card,.panel{background:white;border-radius:9px;padding:18px;box-shadow:0 1px 5px #15365418}.card b{font-size:25px;display:block;margin-top:8px}.panel{margin-bottom:20px;overflow:auto}.pathbox{background:#eef5fa;border-left:4px solid var(--blue);padding:12px;margin:12px 0;font-size:13px;line-height:1.8;word-break:break-all}.upload-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:end}.field label{display:block;font-weight:700;margin-bottom:7px}.field input{width:100%;border:1px solid #cbd5df;border-radius:6px;padding:9px}.checks{margin:12px 0}.message{padding:10px;margin-top:10px;border-radius:6px;display:none}.ok{display:block;background:#ecfdf3;color:var(--green)}.err{display:block;background:#fef3f2;color:var(--red)}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e5eaef;text-align:left;white-space:nowrap}th{color:#536575;font-size:13px}.risk-高风险{color:var(--red);font-weight:700}.risk-中风险{color:var(--amber);font-weight:700}.risk-无风险{color:var(--green);font-weight:700}.empty{text-align:center;padding:40px;color:#708090}@media(max-width:900px){.upload-grid{grid-template-columns:1fr}}
</style></head><body><header><h1>前后向合同智能解析与履约风险审查系统</h1><p>证据可追溯 · 结构化提取 · 确定性风险规则</p></header><main>
<section class="panel"><h2>新建项目并上传合同</h2><div id="paths" class="pathbox">正在读取存储路径……</div>
<form id="uploadForm"><div class="upload-grid"><div class="field"><label>前向合同编号（项目编码）</label><input name="project_code" required placeholder="例如 JSNJA2513970CGN00"></div><div class="field"><label>前向合同及附件（可多选）</label><input type="file" name="forward_pdfs" accept="application/pdf,.pdf" multiple required></div><div class="field"><label>后向合同（可多选）</label><input type="file" name="backward_pdfs" accept="application/pdf,.pdf" multiple required></div></div>
<div class="checks"><label><input id="overwrite" type="checkbox"> 覆盖同项目已有文件</label>　<label><input id="processNow" type="checkbox" checked> 上传后立即解析和审查</label></div><button id="uploadButton" type="submit">上传合同并建立项目</button><span id="progress"></span><div id="message" class="message"></div></form></section>
<div class="toolbar"><button class="secondary" onclick="scan()">扫描上传目录并处理</button><a class="btn" href="/api/export.xlsx">导出审查结果</a></div><section id="cards" class="cards"></section>
<section class="panel"><h2>最近处理任务</h2><table><thead><tr><th>任务编号</th><th>项目编码</th><th>状态</th><th>当前阶段</th><th>进度</th><th>风险等级</th><th>完成时间</th></tr></thead><tbody id="taskRows"></tbody></table></section>
<section class="panel"><h2>项目列表</h2><table><thead><tr><th>项目编码</th><th>状态</th><th>风险等级</th><th>设备差异</th><th>工期风险</th><th>实施差异</th><th>待复核</th><th>更新时间</th></tr></thead><tbody id="rows"></tbody></table></section></main>
<script>
async function get(u,o){let r=await fetch(u,o);if(!r.ok)throw Error(await r.text());return r.json()}
async function loadTasks(){let ts=await get('/api/tasks');taskRows.innerHTML=ts.length?ts.map(t=>`<tr><td>${t.task_id.slice(0,8)}</td><td>${t.project_code}</td><td class="risk-${t.risk_level||''}">${t.status}</td><td>${t.stage}</td><td>${t.progress}%</td><td>${t.risk_level||''}</td><td>${t.completed_at||''}</td></tr>`).join(''):'<tr><td colspan=7 class=empty>本次服务启动后暂无任务</td></tr>'}
async function load(){let cfg=await get('/api/config');paths.innerHTML=`<b>合同上传目录：</b>${cfg['合同上传根目录']}<br><b>审查结果目录：</b>${cfg['审查结果目录']}<br><b>项目数据库：</b>${cfg['项目数据库']}<br><b>保存格式：</b>${cfg['目录格式']}`;let d=await get('/api/dashboard');cards.innerHTML=Object.entries(d).map(([k,v])=>`<div class=card><span>${k}</span><b>${v}</b></div>`).join('');await loadTasks();let ps=await get('/api/projects');rows.innerHTML=ps.length?ps.map(x=>{let p=x.payload;return `<tr onclick="location='/api/projects/${encodeURIComponent(x.project_code)}'"><td>${x.project_code}</td><td>${x.status}</td><td class="risk-${x.risk_level}">${x.risk_level}</td><td>${p.equipment_differences?.length||0}</td><td>${p.schedule_differences?.length||0}</td><td>${p.scope_differences?.length||0}</td><td>${p.review_issues?.length||0}</td><td>${x.updated_at}</td></tr>`}).join(''):'<tr><td colspan=8 class=empty>尚无处理结果，请先上传合同</td></tr>'}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function waitTask(taskId){while(true){let task=await get('/api/tasks/'+taskId);progress.textContent=` 任务 ${taskId.slice(0,8)}：${task.stage}（${task.progress}%）`;if(task.status==='已完成'){message.className='message ok';message.innerHTML=`<b>执行成功</b>：项目 ${task.project_code} 已完成审查，风险等级：${task.risk_level}。<br>结果目录：${task.result_directory}`;await load();return}if(task.status==='失败'){throw Error(`任务 ${taskId.slice(0,8)} 执行失败：${task.error}`)}await sleep(2000)}}
uploadForm.addEventListener('submit',async e=>{e.preventDefault();message.className='message';uploadButton.disabled=true;progress.textContent=' 正在上传合同文件……';try{let q=`?overwrite=${overwrite.checked}&process_now=${processNow.checked}`;let r=await get('/api/projects/upload'+q,{method:'POST',body:new FormData(uploadForm)});if(r.task_id){message.className='message ok';message.textContent=`文件上传成功，后台任务编号：${r.task_id.slice(0,8)}`;await waitTask(r.task_id)}else{message.className='message ok';message.textContent=`项目 ${r['项目编码']} 已保存到 ${r['项目目录']}`;await load()}uploadForm.reset();processNow.checked=true}catch(err){message.className='message err';message.textContent=err.message}finally{uploadButton.disabled=false;progress.textContent=''}})
async function scan(){if(!confirm('扫描合同上传目录并处理全部项目？'))return;await get('/api/scan',{method:'POST'});load()}load().catch(e=>alert(e.message));
setInterval(()=>loadTasks().catch(()=>{}),3000);
</script></body></html>
